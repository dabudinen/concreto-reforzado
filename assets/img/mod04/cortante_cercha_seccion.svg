<svg viewBox="0 0 920 520" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg" style="background: #FFFFFF; border-radius: 10px; font-family: Inter, -apple-system, sans-serif; display: block;" role="img" aria-label="Diseño a Cortante: Cercha de Ritter-Mörsch, Tensión Diagonal y Resistencia Nominal">
  <defs>
    <filter id="m4-shadow" x="-4%" y="-4%" width="108%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>

    <marker id="m4-arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="m4-arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
    <marker id="m4-arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16A34A"/>
    </marker>
    <marker id="m4-arrow-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- ==================== BANNER SUPERIOR ==================== -->
  <rect x="0" y="0" width="920" height="42" rx="10" fill="#F8FAFC"/>
  <line x1="0" y1="42" x2="920" y2="42" stroke="#E2E8F0" stroke-width="1.2"/>
  <text x="24" y="26" fill="#0F172A" font-size="13" font-weight="800" letter-spacing="0.02em">
    DISEÑO A CORTANTE: CERCHA DE RITTER-MÖRSCH Y TENSIÓN DIAGONAL
  </text>
  <rect x="705" y="10" width="195" height="22" rx="11" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="802" y="25" fill="#1D4ED8" font-size="10" font-weight="700" text-anchor="middle">
    NSR-10 CAP. C.11 / ACI 318
  </text>

  <!-- ==================== PANEL SUPERIOR: ELEVACIÓN DE VIGA Y CERCHA A 45° ==================== -->
  <g transform="translate(24, 56)">
    <!-- Marco de fondo -->
    <rect x="0" y="0" width="872" height="236" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    
    <!-- Etiqueta del panel -->
    <rect x="14" y="12" width="280" height="20" rx="4" fill="#DBEAFE"/>
    <text x="22" y="26" fill="#1E40AF" font-size="10" font-weight="700">MECANISMO RESISTENTE: CERCHA RETICULADA A 45°</text>

    <!-- Apoyo columna izquierda -->
    <rect x="50" y="170" width="60" height="50" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="40" y1="220" x2="120" y2="220" stroke="#475569" stroke-width="2"/>
    <!-- Patrón de achurado suelo/apoyo -->
    <line x1="45" y1="225" x2="55" y2="220" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="60" y1="225" x2="70" y2="220" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="75" y1="225" x2="85" y2="220" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="90" y1="225" x2="100" y2="220" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="105" y1="225" x2="115" y2="220" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="80" y="198" fill="#475569" font-size="10" font-weight="700" text-anchor="middle">APOYO</text>

    <!-- Reacción de apoyo V_u -->
    <line x1="80" y1="250" x2="80" y2="224" stroke="#DC2626" stroke-width="2.5" marker-end="url(#m4-arrow-red)"/>
    <text x="80" y="262" fill="#DC2626" font-size="11" font-weight="800" text-anchor="middle">R = V_u</text>

    <!-- Cuerpo de la viga de concreto -->
    <rect x="50" y="55" width="770" height="115" rx="3" fill="#FFFFFF" stroke="#334155" stroke-width="2"/>

    <!-- Cordón superior de compresión (concreto comprimido) -->
    <rect x="50" y="55" width="770" height="16" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1"/>
    <text x="440" y="67" fill="#1E40AF" font-size="10" font-weight="700" text-anchor="middle">Cordón Superior Comprimido: Concreto C = 0.85 f'c a bw</text>

    <!-- Refuerzo longitudinal inferior (Cordón traccionado T) -->
    <line x1="60" y1="156" x2="810" y2="156" stroke="#2563EB" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="65" cy="156" r="3.5" fill="#1D4ED8"/>
    <circle cx="805" cy="156" r="3.5" fill="#1D4ED8"/>
    <text x="440" y="152" fill="#1D4ED8" font-size="10" font-weight="700" text-anchor="middle">Cordón Inferior Traccionado: Acero Longitudinal As (T = As·fy + ΔT)</text>

    <!-- Cara del apoyo (x = 0) -->
    <line x1="110" y1="42" x2="110" y2="180" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="3 3"/>
    <text x="110" y="40" fill="#64748B" font-size="9" font-weight="600" text-anchor="middle">Cara Apoyo</text>

    <!-- Distancia d a sección crítica -->
    <line x1="110" y1="184" x2="225" y2="184" stroke="#64748B" stroke-width="1.2" marker-start="url(#m4-arrow-slate)" marker-end="url(#m4-arrow-slate)"/>
    <text x="167" y="196" fill="#475569" font-size="10" font-weight="800" text-anchor="middle">d (Peralte)</text>

    <!-- Sección crítica de diseño (x = d, NSR-10 C.11.1.3.1) -->
    <line x1="225" y1="42" x2="225" y2="180" stroke="#DC2626" stroke-width="2" stroke-dasharray="4 3"/>
    <rect x="180" y="32" width="90" height="16" rx="3" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="1"/>
    <text x="225" y="44" fill="#B91C1C" font-size="8.5" font-weight="800" text-anchor="middle">SECCIÓN CRÍTICA</text>

    <!-- Fisura diagonal principal a 45° -->
    <path d="M 120 156 Q 165 110 230 71" fill="none" stroke="#DC2626" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 230 71 L 236 67" fill="none" stroke="#DC2626" stroke-width="2" stroke-linecap="round"/>
    <rect x="238" y="74" width="125" height="16" rx="3" fill="#FEF2F2" stroke="#FECACA" stroke-width="0.8"/>
    <text x="300" y="86" fill="#DC2626" font-size="9" font-weight="700" text-anchor="middle">Grieta de Tensión Diagonal (θ ≈ 45°)</text>

    <!-- Bielas diagonales de compresión de concreto (Cercha Ritter-Mörsch) -->
    <line x1="225" y1="71" x2="120" y2="156" stroke="#059669" stroke-width="3" stroke-dasharray="5 3"/>
    <line x1="330" y1="71" x2="225" y2="156" stroke="#059669" stroke-width="3" stroke-dasharray="5 3"/>
    <line x1="435" y1="71" x2="330" y2="156" stroke="#059669" stroke-width="3" stroke-dasharray="5 3"/>
    <line x1="540" y1="71" x2="435" y2="156" stroke="#059669" stroke-width="3" stroke-dasharray="5 3"/>
    <line x1="645" y1="71" x2="540" y2="156" stroke="#059669" stroke-width="3" stroke-dasharray="5 3"/>
    <line x1="750" y1="71" x2="645" y2="156" stroke="#059669" stroke-width="3" stroke-dasharray="5 3"/>

    <!-- Montantes verticales de tracción (Estribos cerrados Av) -->
    <!-- Zona 1: Confinamiento sísmico s1 = d/4 -->
    <line x1="140" y1="71" x2="140" y2="156" stroke="#2563EB" stroke-width="2.5"/>
    <line x1="175" y1="71" x2="175" y2="156" stroke="#2563EB" stroke-width="2.5"/>
    <line x1="210" y1="71" x2="210" y2="156" stroke="#2563EB" stroke-width="2.5"/>
    <line x1="245" y1="71" x2="245" y2="156" stroke="#2563EB" stroke-width="2.5"/>
    <line x1="280" y1="71" x2="280" y2="156" stroke="#2563EB" stroke-width="2.5"/>
    <line x1="315" y1="71" x2="315" y2="156" stroke="#2563EB" stroke-width="2.5"/>

    <!-- Zona 2: Centro de luz s2 = d/2 -->
    <line x1="380" y1="71" x2="380" y2="156" stroke="#3B82F6" stroke-width="2"/>
    <line x1="445" y1="71" x2="445" y2="156" stroke="#3B82F6" stroke-width="2"/>
    <line x1="510" y1="71" x2="510" y2="156" stroke="#3B82F6" stroke-width="2"/>
    <line x1="575" y1="71" x2="575" y2="156" stroke="#3B82F6" stroke-width="2"/>
    <line x1="640" y1="71" x2="640" y2="156" stroke="#3B82F6" stroke-width="2"/>

    <!-- Zona de confinamiento derecha -->
    <line x1="705" y1="71" x2="705" y2="156" stroke="#2563EB" stroke-width="2.5"/>
    <line x1="740" y1="71" x2="740" y2="156" stroke="#2563EB" stroke-width="2.5"/>
    <line x1="775" y1="71" x2="775" y2="156" stroke="#2563EB" stroke-width="2.5"/>

    <!-- Acotado de zona confinada vs central -->
    <line x1="110" y1="205" x2="330" y2="205" stroke="#2563EB" stroke-width="1.2" marker-start="url(#m4-arrow-blue)" marker-end="url(#m4-arrow-blue)"/>
    <text x="220" y="218" fill="#1D4ED8" font-size="9.5" font-weight="700" text-anchor="middle">Zona Confinada: 2h (Estribos cada s ≤ d/4)</text>

    <line x1="330" y1="205" x2="690" y2="205" stroke="#64748B" stroke-width="1.2" marker-start="url(#m4-arrow-slate)" marker-end="url(#m4-arrow-slate)"/>
    <text x="510" y="218" fill="#475569" font-size="9.5" font-weight="700" text-anchor="middle">Zona No Confinada: s ≤ d/2</text>

    <!-- Leyenda de la cercha -->
    <rect x="580" y="90" width="225" height="42" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" filter="url(#m4-shadow)"/>
    <line x1="590" y1="102" x2="615" y2="102" stroke="#059669" stroke-width="2.5" stroke-dasharray="4 2"/>
    <text x="622" y="106" fill="#065F46" font-size="9" font-weight="700">Bielas compresión: D_c (Concreto)</text>
    <line x1="590" y1="120" x2="615" y2="120" stroke="#2563EB" stroke-width="2.5"/>
    <text x="622" y="124" fill="#1E40AF" font-size="9" font-weight="700">Tirantes tracción: T_v = Av·fyt (Estribos)</text>
  </g>

  <!-- ==================== PANEL INFERIOR: TRÍPTICO DE FORMULACIÓN ==================== -->
  
  <!-- Tarjeta 1: Estado Biaxial y Círculo de Mohr -->
  <g transform="translate(24, 304)">
    <rect x="0" y="0" width="280" height="200" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#m4-shadow)"/>
    <rect x="0" y="0" width="280" height="4" rx="2" fill="#2563EB"/>
    <text x="14" y="22" fill="#1E40AF" font-size="11" font-weight="800">1. TENSIÓN DIAGONAL (BIAXIAL)</text>
    
    <!-- Elemento diferencial de esfuerzo en el alma -->
    <rect x="25" y="38" width="56" height="56" rx="2" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <!-- Flechas normales sigma_x -->
    <line x1="12" y1="66" x2="25" y2="66" stroke="#2563EB" stroke-width="1.5" marker-end="url(#m4-arrow-blue)"/>
    <line x1="94" y1="66" x2="81" y2="66" stroke="#2563EB" stroke-width="1.5" marker-end="url(#m4-arrow-blue)"/>
    <!-- Flechas cortante tau_xy -->
    <line x1="30" y1="30" x2="76" y2="30" stroke="#DC2626" stroke-width="1.5" marker-end="url(#m4-arrow-red)"/>
    <line x1="89" y1="43" x2="89" y2="89" stroke="#DC2626" stroke-width="1.5" marker-end="url(#m4-arrow-red)"/>
    
    <!-- Esfuerzo de tracción principal sigma_1 -->
    <text x="110" y="52" fill="#0F172A" font-size="9.5" font-weight="700">Esfuerzo Principal σ_1:</text>
    <text x="110" y="68" fill="#DC2626" font-size="10" font-weight="800">σ_1 = σ_x/2 + √[(σ_x/2)² + τ²]</text>
    <text x="110" y="84" fill="#64748B" font-size="9" font-weight="600">Cuando σ_1 ≥ f_r (Mód. Rotura)</text>
    <text x="110" y="96" fill="#B91C1C" font-size="9" font-weight="700">⇒ Falla frágil por tensión diagonal</text>

    <!-- Regla de control -->
    <rect x="14" y="112" width="252" height="74" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="22" y="128" fill="#0F172A" font-size="9.5" font-weight="700">Mecanismos de Transferencia V_c:</text>
    <text x="22" y="144" fill="#475569" font-size="9">• Zona de concreto comprimido no fisurado (20-40%)</text>
    <text x="22" y="158" fill="#475569" font-size="9">• Trabazón mecánica de agregados en la grieta (35-50%)</text>
    <text x="22" y="172" fill="#475569" font-size="9">• Acción de dovela del acero longitudinal (15-25%)</text>
  </g>

  <!-- Tarjeta 2: Formulación Normativa Vc y Vs -->
  <g transform="translate(320, 304)">
    <rect x="0" y="0" width="280" height="200" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#m4-shadow)"/>
    <rect x="0" y="0" width="280" height="4" rx="2" fill="#16A34A"/>
    <text x="14" y="22" fill="#15803D" font-size="11" font-weight="800">2. RESISTENCIA NOMINAL V_n</text>

    <!-- Fórmula LRFD fundamental -->
    <rect x="14" y="34" width="252" height="30" rx="4" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1"/>
    <text x="140" y="53" fill="#166534" font-size="12" font-weight="800" text-anchor="middle">φ·V_n = φ·(V_c + V_s) ≥ V_u   (φ = 0.75)</text>

    <text x="14" y="82" fill="#0F172A" font-size="10" font-weight="700">Aporte del Concreto (NSR-10 C.11.2):</text>
    <rect x="14" y="88" width="252" height="24" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="140" y="104" fill="#0F172A" font-size="10.5" font-weight="800" text-anchor="middle">V_c = 0.17·λ·√(f'c)·b_w·d   [N]</text>

    <text x="14" y="128" fill="#0F172A" font-size="10" font-weight="700">Aporte de Estribos (NSR-10 C.11.4):</text>
    <rect x="14" y="134" width="252" height="24" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="140" y="150" fill="#1D4ED8" font-size="10.5" font-weight="800" text-anchor="middle">V_s = (A_v · f_yt · d) / s   [N]</text>

    <!-- Límite máximo para evitar falla por compresión diagonal del alma -->
    <rect x="14" y="166" width="252" height="22" rx="4" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1"/>
    <text x="140" y="181" fill="#92400E" font-size="9" font-weight="800" text-anchor="middle">Límite: V_s ≤ 0.66·√(f'c)·b_w·d (Si no, ampliar sección)</text>
  </g>

  <!-- Tarjeta 3: Detallamiento Sísmico y Espaciamientos -->
  <g transform="translate(616, 304)">
    <rect x="0" y="0" width="280" height="200" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#m4-shadow)"/>
    <rect x="0" y="0" width="280" height="4" rx="2" fill="#D97706"/>
    <text x="14" y="22" fill="#B45309" font-size="11" font-weight="800">3. DETALLAMIENTO SÍSMICO</text>

    <!-- Gancho sísmico y ramas -->
    <rect x="14" y="34" width="252" height="40" rx="4" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1"/>
    <text x="22" y="49" fill="#92400E" font-size="9.5" font-weight="800">Ganchos Sísmicos a 135° (C.7.1.4):</text>
    <text x="22" y="65" fill="#78350F" font-size="9">Extensión recta de remate: ≥ max(6·d_b, 75 mm)</text>

    <!-- Espaciamiento en zona confinada (C.21.5.3.2) -->
    <rect x="14" y="82" width="252" height="54" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="22" y="97" fill="#0F172A" font-size="9.5" font-weight="700">Espaciamiento Sísmico s_max (DES):</text>
    <text x="22" y="112" fill="#1D4ED8" font-size="9.5" font-weight="800">s ≤ min( d/4,  8·d_b_long,  24·d_b_estribo,  300 mm )</text>
    <text x="22" y="127" fill="#64748B" font-size="8.5">Primer estribo a máx. 50 mm de la cara del apoyo.</text>

    <!-- Cortante por capacidad Ve -->
    <rect x="14" y="144" width="252" height="44" rx="4" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <text x="22" y="159" fill="#1E40AF" font-size="9.5" font-weight="800">Diseño por Capacidad V_e (C.21.5.4):</text>
    <text x="22" y="176" fill="#1D4ED8" font-size="9.5" font-weight="800">V_e = (M_pr1 + M_pr2) / l_n ± (w_u · l_n) / 2</text>
  </g>

</svg>